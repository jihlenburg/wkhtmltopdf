<!doctype html><meta charset=utf-8><title>positioned</title>
<style>.fix{position:fixed;top:6px;right:6px;background:#fd0;padding:6px;border:1px solid #000}
.abs{position:absolute;left:40px;top:300px;background:#0df;padding:6px}.pad{height:1600px}</style>
<div class=fix>fixed (appears on every page?)</div>
<div class=abs>absolute @ (40,300)</div>
<h1>positioned elements</h1><div class=pad>tall spacer to force multiple pages</div><p>end</p>
