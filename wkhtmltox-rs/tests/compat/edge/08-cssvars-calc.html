<!doctype html><meta charset=utf-8><title>cssvars-calc</title>
<style>:root{--pad:18px;--accent:#b30}.box{padding:var(--pad);width:calc(100% - 40px);border:3px solid var(--accent);color:var(--accent)}</style>
<h1>CSS variables + calc() (no var()/calc in 2012 WebKit)</h1>
<div class=box>width is calc(100% - 40px); padding via var(--pad); border colored via var(--accent).</div>
