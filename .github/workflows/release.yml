name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux x86_64 + arm64 + macOS arm64. (arm64 Linux tarball ships without a
        # bundled chrome-headless-shell — Chrome for Testing has no linux-arm64 build;
        # it uses system chromium / WKHTMLTOX_CHROME, per package.sh + the tarball README.)
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install qpdf (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libqpdf-dev qpdf
      - name: Install qpdf (macOS)
        if: runner.os == 'macOS'
        run: brew install qpdf
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wkhtmltox-rs
      - name: Package
        run: bash scripts/package.sh
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
